name: PregnaCare AI CI Pipeline

on:
  push:
    branches: [ main, master, develop ]
  pull_request:
    branches: [ main, master ]

jobs:
  validate-and-test:
    name: Build & Test Full Stack
    runs-on: ubuntu-latest

    env:
      DATABASE_URL: "file:./dev.db"
      JWT_SECRET: "ci_testing_secret_key_pregnacare_ai_2026"
      NODE_ENV: "test"

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build Shared Packages
        run: |
          npm run --workspace=packages/shared-types build --if-present
          npm run --workspace=packages/validation build --if-present

      - name: Setup Backend Database & Generate Prisma Client
        run: |
          cd server
          npm run db:prepare
          npx prisma generate
          npx prisma db push --skip-generate

      - name: Run Backend Integration & Security Tests
        run: |
          cd server
          npm test

      - name: Build Web Application
        run: |
          cd apps/web
          npm run build
